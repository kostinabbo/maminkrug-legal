<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Документы — Мамин круг</title><style>
:root{--bg:#FFF8F2;--card:#FFFFFF;--ink:#2A1F1A;--soft:#5F4F46;--line:#E2D2C7;--brand:#B5482F;--error:#B3261E}
@media(prefers-color-scheme:dark){:root{--bg:#1A1411;--card:#231B17;--ink:#F2E4DC;--soft:#D4C3B9;--line:#4C3F38;--brand:#FFB59F;--error:#FFB4AB}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.6 system-ui,-apple-system,Roboto,sans-serif}
main{max-width:720px;margin:0 auto;padding:32px 20px 64px}h1{font-size:28px;line-height:1.25;margin:0 0 16px}h2{font-size:20px;margin:32px 0 8px}
a{color:var(--brand)}p,li{color:var(--ink)}.note{color:var(--soft)}
form{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:20px;margin-top:20px}
label{display:block;font-weight:600;margin:12px 0 4px}label.check{display:flex;gap:10px;font-weight:400;align-items:flex-start}
input[type=email],input[type=password]{width:100%;font:inherit;padding:12px 14px;border:1px solid var(--line);border-radius:14px;background:var(--bg);color:var(--ink)}
input[type=checkbox]{width:20px;height:20px;margin-top:4px}
button{margin-top:16px;width:100%;font:inherit;font-weight:700;padding:13px;border:0;border-radius:14px;background:var(--brand);color:var(--bg);cursor:pointer}
.error{color:var(--error);font-weight:600}.ok{font-weight:600}nav{margin-top:32px}nav a{display:block;padding:6px 0}
</style></head><body><main><h1>Мамин круг</h1><p>Форум для мам. Приложение для Android.</p><nav><a href="privacy.html">Политика конфиденциальности</a></nav></main></body></html>
